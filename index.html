function addIngToFridge(name, qty, unit){
  const [bu, k] = baseUnit(unit);
  const ex = S.fridge.find(f => f.kind === "ing" && norm(f.name) === norm(name) && baseUnit(f.unit)[0] === bu);
  if (ex){
    if (ex.qty == null) return true;            // количество не отслеживается — просто «есть»
    if (qty == null){ ex.qty = null; return true; }
    const [ebu, ek] = baseUnit(ex.unit);
    if (ek !== 1 || k !== 1){ ex.qty = ex.qty * ek + qty * k; ex.unit = ebu; } else ex.qty += qty;
    return true;
  }
  S.fridge.push({ id: uid(), kind:"ing", name: name.trim(), qty, unit: FRIDGE_UNITS.includes(unit) ? unit : "шт", recipeId:null });
  return false;
}
function moveBoughtToFridge(){
  const ws = UI.weekStart;
  const bought = new Set(S.bought[ws] || []);
  const items = aggregate(ws).toBuy.filter(i => bought.has(i.key));
  if (!items.length) return;
  items.forEach(i => addIngToFridge(i.name, i.unit === "по вкусу" ? null : i.qty, i.unit === "по вкусу" ? "шт" : i.unit));
  S.bought[ws] = [...bought].filter(k => !items.some(i => i.key === k));
  commit();
  toast(items.length + " " + pl(items.length,"продукт","продукта","продуктов") + " в холодильнике");
}

  }

function openReview(){

    items.map(f => '<div class="rv" data-fid="' + f.id + '">' +

    commit(); toast("«" + r.name + "» в холодильнике: " + x.portions + " " + pl(x.portions,"порция","порции","порций"));

/* ---------- what can be cooked from the fridge ---------- */
function analyzeRecipe(r){
  const missing = [], short = [];
  let present = 0, counted = 0;
  r.ingredients.forEach(i => {
    if (i.unit === "по вкусу") return; // соль, специи и т. п. не учитываем
    counted++;
    const items = S.fridge.filter(f => f.kind === "ing" && norm(f.name) === norm(i.name));
    if (!items.length){ missing.push(i.name); return; }
    present++;
    if (i.qty == null) return;
    const [bu, k] = baseUnit(i.unit);
    const same = items.filter(f => baseUnit(f.unit)[0] === bu);
    if (!same.length || same.some(f => f.qty == null)) return; // единицы разные или количество не важно — считаем, что хватает
    const have = same.reduce((s, f) => s + f.qty * baseUnit(f.unit)[1], 0);
    const need = i.qty * k;
    if (have + 0.0001 < need) short.push(i.name + ": нужно " + showQty(need, bu) + ", есть " + showQty(have, bu));
  });
  return { missing, short, present, counted };
}
function openCookable(){
  const today = todayStr();
  const ready = S.fridge.filter(f => f.kind === "dish");
  const rows = S.recipes.map(r => ({ r, a: analyzeRecipe(r) })).filter(x => x.a.counted);
  const full = rows.filter(x => !x.a.missing.length && !x.a.short.length).sort((a,b) => a.r.name.localeCompare(b.r.name, "ru"));
  const almost = rows.filter(x => {
    const gaps = x.a.missing.length + x.a.short.length;
    return gaps > 0 && gaps <= 2 && x.a.present >= Math.ceil(x.a.counted / 2);
  }).sort((a,b) => (a.a.missing.length + a.a.short.length) - (b.a.missing.length + b.a.short.length) || a.r.name.localeCompare(b.r.name, "ru"));
  const addBtn = r => SLOTS.includes(r.type) ? '<button class="mini" data-cook="' + r.id + '">В план на сегодня</button>' : '<span class="muted" style="font-size:.8rem">' + TYPE_L[r.type].toLowerCase() + '</span>';
  const card = (x, note) => '<div class="ck"><div class="ckt"><b>' + esc(x.r.name) + '</b><span class="muted">' + TYPE_L[x.r.type] + (x.r.time ? ' · ' + fmtTime(x.r.time) : '') + ' · ' + x.r.servings + ' ' + pl(x.r.servings,"порция","порции","порций") + '</span>' + (note || '') + '</div>' + addBtn(x.r) + '</div>';
  let body = '';
  if (ready.length){
    body += '<h3 class="sh2" style="margin-top:4px">Уже готово</h3><div class="flist">' + ready.map(f => {
      const r = recipeById(f.recipeId);
      return '<div class="ck"><div class="ckt"><b>' + esc(dishName(f)) + '</b><span class="muted">' + (f.qty ? fmt(f.qty) + ' ' + pl(Math.round(f.qty),"порция","порции","порций") : 'есть') + '</span></div>' +
        (r && SLOTS.includes(r.type) ? '<button class="mini" data-cookready="' + r.id + '">В план на сегодня</button>' : '') + '</div>';
    }).join("") + '</div>';
  }
  body += '<h3 class="sh2">Можно приготовить сейчас</h3>' + (full.length
    ? '<div class="flist">' + full.map(x => card(x)).join("") + '</div>'
    : '<p class="muted" style="margin:0 2px">Ни для одного рецепта не хватает всех продуктов.</p>');
  if (almost.length){
    body += '<h3 class="sh2">Не хватает одного-двух продуктов</h3><div class="flist">' + almost.map(x =>
      card(x, '<span class="ckm">' + esc(x.a.missing.map(n => "нет: " + n).concat(x.a.short).join("; ")) + '</span>')).join("") + '</div>';
  }
  body += '<p class="note">Учитываются продукты из холодильника и количества, где они указаны. Ингредиенты «по вкусу» не учитываются. Если продукт записан в других единицах, чем в рецепте, планер считает, что его хватает. Проверьте сами.</p>';
  const s = openSheet("Что приготовить", body, "");
  s.el.addEventListener("click", e => {
    const b = e.target.closest("[data-cook],[data-cookready]"); if (!b) return;
    const id = b.dataset.cook || b.dataset.cookready;
    const r = recipeById(id); if (!r) return;
    addToPlan(today, r.type, id, !!b.dataset.cookready);
    UI.weekStart = mondayOf(today); UI.day = dayIdx(today);
    s.close(); commit(); toast("«" + r.name + "» в плане на сегодня");
  });
}

/* ---------- settings & reminders ---------- */
function nextReminder(){
  const [h, m] = S.settings.remTime.split(":").map(Number);
  const now = new Date();
  let date = addDays(mondayOf(todayStr()), S.settings.remDay);
  const at = parseD(date); at.setHours(h, m, 0, 0);
  if (at.getTime() <= now.getTime()) date = addDays(date, 7);
  return { date, h, m };
}
function buildIcs(){
  const { date, h, m } = nextReminder();
  const pad = n => String(n).padStart(2, "0");
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const start = date.replace(/-/g, "") + "T" + pad(h) + pad(m) + "00";
  const link = location.origin + location.pathname;
  const text = "Проверьте холодильник и запланируйте меню на следующую неделю".replace(/[,;]/g, m => "\\" + m);
  return [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Menu Planner//RU", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    "UID:menu-planner-weekly-" + Date.now() + "@menu-planner",
    "DTSTAMP:" + stamp,
    "DTSTART:" + start,
    "DURATION:PT15M",
    "RRULE:FREQ=WEEKLY;BYDAY=" + ICS_DAYS[S.settings.remDay],
    "SUMMARY:Меню на неделю: холодильник и план",
    "DESCRIPTION:" + text + "\\n" + link,
    "URL:" + link,
    "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + text, "TRIGGER:PT0M", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].map(foldIcs).join("\r\n") + "\r\n";
}
// строки календаря длиннее 75 байт переносятся по RFC 5545, не разрывая символы
function foldIcs(line){
  const enc = new TextEncoder();
  let out = "", cur = "", len = 0;
  for (const ch of line){
    const n = enc.encode(ch).length;
    if (len + n > 73){ out += cur + "\r\n "; cur = ""; len = 1; }
    cur += ch; len += n;
  }
  return out + cur;
}
function icsFile(){ return new File([buildIcs()], "napominanie-menu.ics", { type:"text/calendar" }); }
function downloadIcs(){
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(icsFile());
    a.download = "napominanie-menu.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch(e){ toast("Не получилось создать файл напоминания"); }
}
async function shareIcs(){
  try { await navigator.share({ files:[icsFile()], title:"Напоминание о меню" }); }
  catch(e){ if (!e || e.name !== "AbortError") downloadIcs(); }
}
function openSettings(){
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files:[ icsFile() ] })); } catch(e){}
  const st = S.settings;
  const body =
    '<div class="field"><span>Сколько человек обычно едят</span><div class="num">' +
      '<button type="button" data-pp="-1" aria-label="Меньше">−</button><input id="s-people" inputmode="numeric" value="' + st.people + '" aria-label="Человек"><button type="button" data-pp="1" aria-label="Больше">+</button>' +
    '</div><p class="muted" style="font-size:.84rem;margin:6px 0 0">Используется в автоподборе меню.</p></div>' +
    '<div class="field"><span>Еженедельное напоминание</span>' +
      '<div class="prow2"><select class="inp" id="s-day">' + DAYS.map((d, i) => '<option value="' + i + '"' + (st.remDay === i ? ' selected' : '') + '>' + d + '</option>').join("") + '</select>' +
      '<input class="inp" type="time" id="s-time" value="' + st.remTime + '"></div>' +
      '<p class="muted" style="font-size:.84rem;margin:6px 0 0">В это время в планере появится напоминание проверить холодильник и спланировать следующую неделю.</p></div>' +
    '<div class="field"><span>Уведомление на телефоне</span>' +
      '<p style="margin:0 0 10px;font-size:.92rem">Веб-приложение не может само присылать уведомления по расписанию без сервера. Поэтому напоминание добавляется в календарь телефона как повторяющееся событие ' + esc(DAYS_EVERY[st.remDay]) + ' в ' + esc(st.remTime) + ', и уведомление присылает уже календарь.</p>' +
      '<button class="btn primary wide" data-ics="get">Добавить напоминание в календарь</button>' +
      (canShare ? '<button class="btn wide" data-ics="share" style="margin-top:8px">Отправить файл напоминания</button>' : '') +
      '<p class="muted" style="font-size:.84rem;margin:8px 0 0">Если календарь не открылся сам, отправьте файл себе, например в «Избранное» Telegram, и откройте его оттуда. Если поменяете день или время, удалите старое событие в календаре и добавьте новое.</p></div>';
  const s = openSheet("Настройки", body, "");
  const el = s.el;
  const ppl = el.querySelector("#s-people");
  const save = () => {
    st.people = Math.min(20, Math.max(1, parseInt(ppl.value, 10) || 1)); ppl.value = st.people;
    st.remDay = Number(el.querySelector("#s-day").value);
    const t = el.querySelector("#s-time").value;
    if (/^\d{2}:\d{2}$/.test(t)) st.remTime = t;
    st.remDismissed = null;
    commit();
  };
  el.querySelectorAll("[data-pp]").forEach(b => b.addEventListener("click", () => {
    ppl.value = Math.min(20, Math.max(1, (parseInt(ppl.value, 10) || 1) + Number(b.dataset.pp))); save();
  }));
  ppl.addEventListener("change", save);
  el.querySelector("#s-day").addEventListener("change", () => { save(); s.close(); openSettings(); });
  el.querySelector("#s-time").addEventListener("change", () => { save(); s.close(); openSettings(); });
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-ics]"); if (!b) return;
    if (b.dataset.ics === "get") downloadIcs(); else shareIcs();
  });
}
$("settings").addEventListener("click", openSettings);

/* ---------- exchange: file with recipes, merge on import ---------- */
function parsePayload(text){
  try {
    const p = JSON.parse(text);
    if (!p) return null;
    return { savedAt: p.savedAt || null, data: normalize(p.data ? p.data : p) };
  } catch(e){ return null; }
}
function extractFromHtml(html){
  const m = html.match(/<script type="application\/json" id="embedded">([\s\S]*?)<\/script>/);
  return m ? parsePayload(m[1]) : null;
}
function exportName(){ return "recepty-" + todayStr() + ".json"; }
function exportBlob(){
  return new Blob([JSON.stringify({ app:"menu-planner", version:6, savedAt:new Date().toISOString(), data:S })], { type:"application/json" });
}
function downloadExport(){
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(exportBlob());
    a.download = exportName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Файл сохранён");
  } catch(e){ toast("Не получилось сохранить файл"); }
}
function canShareFiles(){
  try { return !!(navigator.canShare && navigator.canShare({ files:[ new File(["{}"], "t.json", { type:"application/json" }) ] })); }
  catch(e){ return false; }
}
async function shareExport(){
  try {
    await navigator.share({ files:[ new File([exportBlob()], exportName(), { type:"application/json" }) ], title:"Рецепты" });
  } catch(e){
    if (e && e.name === "AbortError") return;
    downloadExport();
  }
}
function computeMerge(inc){
  const byId = new Map(S.recipes.map(r => [r.id, r]));
  const tomb = new Map(S.deleted.map(t => [t.id, t.at]));
  let added = 0, updated = 0, removed = 0;
  inc.deleted.forEach(t => {
    if (t.at > (tomb.get(t.id) || 0)) tomb.set(t.id, t.at);
    const loc = byId.get(t.id);
    if (loc && (loc.updatedAt || 0) <= t.at){ byId.delete(t.id); removed++; }
  });
  inc.recipes.forEach(r => {
    const t = tomb.get(r.id);
    if (t != null && t >= (r.updatedAt || 0)) return;
    const loc = byId.get(r.id);
    if (!loc){ byId.set(r.id, r); added++; tomb.delete(r.id); }
    else if ((r.updatedAt || 0) > (loc.updatedAt || 0)){ byId.set(r.id, r); updated++; }
  });
  return { added, updated, removed, recipes:[...byId.values()], deleted:[...tomb].map(([id, at]) => ({ id, at })) };
}
function applyMerge(m){
  const before = new Set(S.recipes.map(r => r.id));
  S.recipes = m.recipes;
  S.deleted = m.deleted;
  const now = new Set(S.recipes.map(r => r.id));
  dropRecipeRefs(new Set([...before].filter(id => !now.has(id))));
  UI.open = {};
  commit();
}
function dateLabel(iso){
  try { return new Date(iso).toLocaleString("ru-RU", { day:"numeric", month:"long", hour:"2-digit", minute:"2-digit" }); }
  catch(e){ return ""; }
}
function offerImport(got){
  const m = computeMerge(got.data);
  const n = got.data.recipes.length;
  const when = got.savedAt ? " Файл сохранён " + dateLabel(got.savedAt) + "." : "";
  const parts = [];
  if (m.added) parts.push("новых " + m.added);
  if (m.updated) parts.push("обновлённых " + m.updated);
  if (m.removed) parts.push("удалённых " + m.removed);
  const summary = parts.length ? "При объединении будет " + parts.join(", ") + "." : "Все рецепты из файла у вас уже есть, объединять нечего.";
  const s = openSheet("Рецепты из файла",
    '<p style="margin:4px 0 10px">В файле ' + n + ' ' + pl(n,"рецепт","рецепта","рецептов") + '.' + esc(when) + '</p>' +
    '<p style="margin:0 0 10px"><b>' + esc(summary) + '</b> Ваши рецепты, план и холодильник останутся.</p>' +
    '<p class="muted" style="margin:0 0 12px">Если это ваша собственная резервная копия, можно заменить всё содержимое планера, включая план, холодильник и отметки в списках покупок.</p>' +
    '<button class="btn wide danger" data-replace style="margin-bottom:4px">Заменить всё содержимым файла</button>',
    '<button class="btn" data-close>Отмена</button>' + (parts.length ? '<button class="btn primary" data-merge>Объединить</button>' : ''), { sticky:true });
  const mb = s.el.querySelector("[data-merge]");
  if (mb) mb.addEventListener("click", () => { s.close(); applyMerge(m); toast("Рецепты объединены"); });
  s.el.querySelector("[data-replace]").addEventListener("click", () => {
    s.close();
    askConfirm("Заменить всё содержимое планера данными из файла? Текущие рецепты, план и холодильник будут удалены.", "Заменить", () => {
      S = got.data; UI.open = {}; commit(); toast("Данные заменены");
    });
  });
}
$("exchange").addEventListener("click", () => {
  const photos = S.recipes.filter(r => r.photo).length;
  const size = JSON.stringify(S).length;
  const share = canShareFiles();
  const body = '<div class="bk">' +
    '<p>Отправьте файл с рецептами другому человеку, например в Telegram. Он загрузит его в свой планер, и рецепты объединятся с его собственными. Фото передаются вместе с рецептами.</p>' +
    '<p>Этот же файл служит резервной копией всего планера, включая план и холодильник: время от времени отправляйте его себе, например в «Избранное» Telegram.</p>' +
    '<p class="cur">Сейчас: ' + S.recipes.length + ' ' + pl(S.recipes.length,"рецепт","рецепта","рецептов") + ', ' + photos + ' фото, файл примерно ' + sizeLabel(size) + '.</p>' +
    (share ? '<button class="btn primary wide" data-x="share">Отправить файл с рецептами</button><button class="btn wide" data-x="save">Сохранить файл на телефон</button>'
           : '<button class="btn primary wide" data-x="save">Сохранить файл с рецептами</button>') +
    '<button class="btn wide" data-x="load">Загрузить рецепты из файла</button>' +
    '<button class="btn wide" data-x="starter">Добавить стартовые рецепты</button>' +
    '<input type="file" id="x-file" accept=".json,.html,.htm,application/json,text/html" hidden></div>';
  const s = openSheet("Обмен рецептами", body, "");
  const inp = s.el.querySelector("#x-file");
  s.el.addEventListener("click", e => {
    const b = e.target.closest("[data-x]"); if (!b) return;
    if (b.dataset.x === "share") shareExport();
    if (b.dataset.x === "save") downloadExport();
    if (b.dataset.x === "load") inp.click();
    if (b.dataset.x === "starter"){
      loadStarter().then(got => {
        if (!got){ toast("Не получилось загрузить стартовые рецепты. Нужен интернет"); return; }
        s.close(); offerImport(got);
      });
    }
  });
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; inp.value = "";
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const text = String(fr.result || "");
      const got = /^\s*[\[{]/.test(text) ? parsePayload(text) : extractFromHtml(text);
      if (!got || (!got.data.recipes.length && !got.data.deleted.length)){ toast("В этом файле нет рецептов планера"); return; }
      s.close();
      offerImport(got);
    };
    fr.onerror = () => toast("Не получилось прочитать файл");
    fr.readAsText(f);
  });
});

/* ---------- starter recipes ---------- */
async function loadStarter(){
  try {
    const res = await fetch("starter-recipes.json", { cache:"no-cache" });
    if (!res.ok) return null;
    return parsePayload(await res.text());
  } catch(e){ return null; }
}
async function seedOnFirstRun(){
  // только для совсем нового планера: если рецепты уже были или их удалили, ничего не добавляем
  if (S.starterLoaded || S.recipes.length || S.deleted.length) return;
  const got = await loadStarter();
  if (!got || !got.data.recipes.length) return;
  if (S.recipes.length) return; // пока грузилось, пользователь мог начать сам
  const m = computeMerge(got.data);
  S.recipes = m.recipes;
  S.starterLoaded = true;
  commit();
  toast("Добавлено " + m.added + " " + pl(m.added,"рецепт","рецепта","рецептов") + " для начала");
}

/* ---------- start ---------- */
let lastToday = todayStr();
document.addEventListener("visibilitychange", () => {
  // приложение могло провисеть открытым до следующего дня — обновляем «сегодня»
  if (document.visibilityState !== "visible") return;
  const t = todayStr();
  if (t !== lastToday){
    if (UI.weekStart === mondayOf(lastToday)){ UI.weekStart = mondayOf(t); UI.day = dayIdx(t); }
    lastToday = t; render();
  }
});
(async function start(){
  S = await loadState();
  const startView = location.hash.slice(1);
  UI.view = VIEWS.includes(startView) ? startView : (S.recipes.length ? "week" : "recipes");
  render();
  seedOnFirstRun();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ("serviceWorker" in navigator && location.protocol !== "file:"){
    try { await navigator.serviceWorker.register("sw.js"); } catch(e){}
  }
})();
})();
